<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F051D;color:#F3E8FF}
.cz{font-family:Cinzel,serif}
.g{background:linear-gradient(135deg,#EC4899,#F9A8D4,#DB2777);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:linear-gradient(135deg,#EC4899,#DB2777);color:#fff;font-weight:600;border-radius:.75rem;padding:.6rem 1rem;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.btn:hover{box-shadow:0 0 20px #EC489999}
.btn2{border:1px solid #3B185F;border-radius:.75rem;padding:.5rem .9rem;font-size:.75rem}
.btn2:hover{border-color:#EC4899}
.in{width:100%;background:#0008;border:1px solid #3B185F;border-radius:.75rem;padding:.7rem 1rem;color:#fff}
.in:focus{outline:none;border-color:#EC4899}
.card{background:#1A0B2E;border:1px solid #3B185F;border-radius:1.25rem}
.lb{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;margin-bottom:.25rem}
.hidden{display:none}
.fcb{width:3rem;height:3rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#fff;box-shadow:0 8px 20px #0008}

<body>
<header class="sticky top-0 z-40 bg-[#0F051D]/90 backdrop-blur border-b border-[#3B185F]">
 <div id="hdr" class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between"></div>
</header>
<main id="app" class="max-w-6xl mx-auto px-4 py-10 min-h-[70vh]"></main>
<footer id="ft" class="border-t border-[#3B185F] py-8 text-center text-xs text-gray-500 space-y-2"></footer>

<div id="cart" class="hidden fixed inset-0 z-50 bg-black/80 flex justify-end"><div id="cartBox" class="card w-full max-w-md h-full p-6 overflow-y-auto"></div></div>
<div id="auth" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto">
 <div class="card w-full max-w-md p-6 space-y-3 my-6">
  <div class="flex justify-between"><h3 id="aT" class="cz text-xl g">Sign In</h3><button onclick="$('auth').classList.add('hidden')">✕</button></div>
  <div id="aReg" class="hidden space-y-3">
   <div><label class="lb">Full name</label><input id="aName" class="in"></div>
   <div><label class="lb">Phone</label><input id="aPhone" type="tel" class="in" placeholder="Phone number"></div>
   <div><label class="lb">Alternative phone (required)</label><input id="aPhone2" type="tel" class="in" placeholder="Another number we can reach"></div>
   <div><label class="lb">Governorate</label><select id="aGov" class="in"><option value="">Select governorate</option></select></div>
   <div><label class="lb">City / District</label><input id="aCity" class="in" placeholder="e.g. Nasr City"></div>
   <div><label class="lb">Street, building, apartment</label><textarea id="aAddr" rows="2" class="in"></textarea></div>
  </div>
  <div><label class="lb">Email</label><input id="aEmail" type="email" class="in"></div>
  <div><label class="lb">Password (6+ characters)</label><input id="aPass" type="password" class="in"></div>
  <button id="aGo" class="btn w-full py-3" onclick="authGo()">Sign In</button>
  <button id="aSw" class="text-xs text-gray-400 w-full" onclick="authMode(mode=='in'?'reg':'in')">New here? Register</button>
 </div>
</div>
<div id="pm" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto" onclick="if(event.target==this)this.classList.add('hidden')"><div id="pmb" class="card w-full max-w-3xl p-6 relative my-6"></div></div>
<div id="sd" class="hidden fixed inset-0 z-50 bg-black/60" onclick="if(event.target==this)side(0)"><div id="sdb" class="card h-full w-72 p-6 !rounded-none overflow-y-auto"></div></div>
<div id="fc" class="fixed bottom-6 right-6 z-40 flex flex-col gap-3"></div>
<datalist id="mdl"></datalist>
<div id="toast" class="fixed bottom-6 left-6 z-50 space-y-2"></div>

<script>
/* ===== 1. PASTE YOUR FIREBASE CONFIG (Project settings > Your apps > Web) ===== */
const FB={apiKey:"AIzaSyBTLrXRUyVqjRBZndUBXwul_3K8_K7FeyE",authDomain:"byahand-89b4e.firebaseapp.com",projectId:"byahand-89b4e",storageBucket:"byahand-89b4e.firebasestorage.app",appId:"1:1003230017206:web:ed83341bd5fb97444ad817"};
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore();
const GOV=['Cairo','Giza','Alexandria','Qalyubia','Port Said','Suez','Damietta','Dakahlia','Sharqia','Gharbia','Monufia','Kafr El Sheikh','Beheira','Ismailia','Beni Suef','Fayoum','Minya','Asyut','Sohag','Qena','Luxor','Aswan','Red Sea','New Valley','Matrouh','North Sinai','South Sinai'];
const FALL="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%231A0B2E'/><text x='100' y='135' font-size='100' fill='%23EC4899' text-anchor='middle'>B</text></svg>";
const LBL={pending:'Awaiting confirmation',approved:'Confirmed - preparing your order',sent_to_zink:'In production at Zink Print',rejected:'Cancelled',shipped:'On its way to you',delivered:'Delivered ✓',refused:'Delivery refused',returned:'Returned',cancelled:'Cancelled by customer'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bad=e=>{e.onerror=null;e.src=FALL};
const im=(s,c)=>`<img src="${esc(s||FALL)}" class="${c}" onerror="bad(this)">`;
const MODELS=[...new Set("other|iPhone 16 Pro Max|iPhone 16 Pro|iPhone 16|iPhone 14 Pro|iPhone 13 Pro|iPhone 13 mini|iPhone 13|iPhone 12 Pro Max|iPhone 12 Pro|iPhone 12 mini|iPhone 11 Pro Max|iPhone 11 Pro|iPhone 11|iPhone X/XS|iPhone 7+|iPhone 7|iPhone 6+|iPhone 6|Samsung Galaxy S10|Samsung Galaxy S10 Lite|Samsung Galaxy S9 Plus|Samsung Note 4|Samsung Note 9|Samsung Note 10 Lite|Samsung Note 10 Pro/10+|Samsung Note 20 Ultra|Samsung Note 20 Plus|Samsung S20|Samsung S20 Plus|Samsung S20 FE|Samsung S20 Ultra|Samsung S21/S30|Samsung S21 Plus|Samsung S22 Ultra|Samsung S23|Samsung S23 Ultra|Samsung A02/M02|Samsung A022/M02S|Samsung A03s|Samsung A04|Samsung A05s|Samsung A12/M12|Samsung A13 4G|Samsung A14|Samsung A15|Samsung A20/A30/M10s|Samsung A20s|Samsung A21|Samsung A21s|Samsung A22 4G|Samsung A22 5G|Samsung A23|Samsung A24|Samsung A30s|Samsung A31/A8|Samsung A32 4G|Samsung A32 5G|Samsung A33|Samsung A35 5G|Samsung A51/M40s|Samsung A52|Samsung A53|Samsung A54|Samsung A70/A70s|Samsung A80|Samsung M11|Samsung M30s|Samsung M31|Samsung M33 5G|Samsung M51|Samsung M52|Samsung M53|Redmi 9|Redmi 9T|Redmi 10|Redmi 10C|Redmi 12|Redmi Note 8|Redmi Note 8 Pro|Redmi Note 9|Redmi Note 9S|Redmi Note 10 Pro|Redmi Note 10 5G|Redmi Note 10S|Redmi Note 11 5G|Redmi Note 11 Pro 5G/4G|Redmi Note 11S 4G|Redmi Note 11 T5G|Redmi Note 13|Xiaomi Redmi Note 7/7 Pro/Mi Note 7|Xiaomi Redmi Note 9|Xiaomi Note 9s/9 Pro|Xiaomi Note 8|Xiaomi HM Note 9S/9 Pro Max/Note 10 Lite|Xiaomi HM Note 10 Pro 5G|Xiaomi HM Note 11 5G|Xiaomi HM Note 11 4G|Xiaomi Mi 11T|Xiaomi Mi 12T|Xiaomi 9T/9T Pro|Mi Note 10 Lite|Huawei Nova 2i/Mate 10 Lite/Honor 9i|Huawei Nova 7|Huawei Honor 20 Pro|Huawei Honor 50 Lite/X20/Nova 8i|Huawei Honor 20/Nova 5T|Huawei Honor 20 Lite|Huawei Honor Play|Huawei Honor 8X|Huawei Mate 20 Pro|Realme 7|Realme 7 Pro|Realme 8|Realme 8 Pro|Realme 10|Realme 11|Realme C15/C12/C25|Realme C21|Realme C53|Realme 9i/Oppo A76/A36|Oppo F7|Oppo F11|Oppo A57|Oppo A52|Oppo A54 4G/A55 5G|Oppo A73/F17|Oppo A75|Oppo A80|Oppo A92/A72/A52|Oppo A93/Reno 4 Lite/F17 Pro/Reno 2F|Oppo Reno 2|Oppo Reno 2F/2Z|Oppo Reno 3|Oppo Reno 4 Pro|Oppo Reno 5|Oppo Reno 5 4G/5G|Oppo Reno 5 Pro|Oppo Reno 6 5G|Oppo Reno 8T 4G|Oppo Reno 10 5G".split('|'))];
const isCase=p=>/case/i.test(p.category||'');
const noSize=p=>!isCase(p)&&/tote|bag/i.test((p.category||'')+' '+(p.name||''));
const szt=z=>z?' ('+z+')':'';
const pick=(p,id)=>noSize(p)?'':isCase(p)?`<input id="${id}" list="mdl" class="in !w-auto !py-2 text-xs" placeholder="Search phone model" style="min-width:9rem">`:`<select id="${id}" class="in !w-auto !py-2 text-xs">${['S','M','L','XL'].map(z=>`<option>${z}</option>`).join('')}</select>`;
const rt=id=>{const a=(S.ratings||[]).filter(x=>x.pid==id);if(!a.length)return '';const m=a.reduce((t,x)=>t+x.stars,0)/a.length,k=Math.round(m);return `<div class="text-pink-400 text-sm">${'★'.repeat(k)}${'☆'.repeat(5-k)} <span class="text-xs text-gray-500">${m.toFixed(1)} (${a.length})</span></div>`};
const canRate=id=>S.user&&S.orders.some(o=>o.status=='delivered'&&o.items.some(i=>i.pid==id));
const myRate=id=>((S.ratings||[]).find(x=>x.pid==id&&S.user&&x.uid==S.user.uid)||{}).stars||0;
const nt=()=>S.site.notes?`<div class="card p-6 mt-6 max-w-3xl mx-auto"><h3 class="cz g text-lg mb-2">NOTES</h3><p class="text-sm text-gray-300 whitespace-pre-wrap">${esc(S.site.notes)}</p></div>`:'';
const safe=u=>/^https?:\/\//.test(u||'')?u:'#';
const ph=s=>String(s||'').replace(/[\s\-()]/g,'');
const okPh=s=>/^\+?\d{10,15}$/.test(ph(s));
const expect=o=>{let t=0;for(const i of o.items){const p=S.products.find(x=>x.id==i.pid);if(!p)return null;t+=+p.price}let d=0;if(o.coupon){const c=(S.coupons||[]).find(x=>x.id==o.coupon);if(!c)return null;d=c.type=='pct'?Math.round(t*c.value/100):Math.min(c.value,t)}return t-d};
const sum=()=>S.cart.reduce((a,i)=>a+i.price,0);
const disc=s=>!S.coupon?0:S.coupon.type=='pct'?Math.round(s*S.coupon.value/100):Math.min(S.coupon.value,s);
const govList=()=>S.site.govs&&S.site.govs.length?S.site.govs:GOV;
const tot=()=>sum()-disc(sum());
const skuOf=p=>p.items&&p.items.length?p.items.map(i=>(S.products.find(x=>x.id==i)||{}).zinkSKU).join(' + '):p.zinkSKU;
let S={user:null,profile:null,admin:false,unlocked:false,coupons:[],site:{},products:[],orders:[],view:'shop',cart:JSON.parse(localStorage.getItem('bah_cart')||'[]')},unsubO=null,unsubC=null,mode='in';

function toast(m,err){const d=document.createElement('div');d.className='px-4 py-3 rounded-xl text-sm border '+(err?'bg-red-950 border-red-500 text-red-200':'bg-[#1A0B2E] border-pink-500 text-pink-300');d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),3500)}
function up(f,p,max=700){return new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=()=>no(new Error('Could not read this image'));i.src=u})}
const save=()=>localStorage.setItem('bah_cart',JSON.stringify(S.cart));
const go=v=>{if(['checkout','orders','admin','account'].includes(v)&&!S.user){authOpen('in');return}if(v=='admin'&&!S.admin)return;S.view=v;$('cart').classList.add('hidden');render();scrollTo(0,0)};

/* ===== live shared data ===== */
db.doc('settings/site').onSnapshot(s=>{S.site=s.data()||{};render()});
db.collection('ratings').onSnapshot(s=>{S.ratings=s.docs.map(d=>d.data());render()});
db.collection('products').onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));render()});
function startData(){
 if(unsubO){unsubO();unsubO=null}if(unsubC){unsubC();unsubC=null}
 const u=S.user;if(!u)return;
 if(S.unlocked)unsubC=db.collection('coupons').onSnapshot(c=>{S.coupons=c.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e));else S.coupons=[];
 const q=S.unlocked?db.collection('orders'):db.collection('orders').where('uid','==',u.uid);
 unsubO=q.onSnapshot(s=>{if(S.unlocked&&S.ordersLoaded)s.docChanges().forEach(c=>{if(c.type=='added')toast('🔔 New order from '+c.doc.data().customer.name)});S.ordersLoaded=true;S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()},e=>console.error(e));
}
auth.onAuthStateChanged(async u=>{
 S.user=u;S.admin=false;S.unlocked=false;S.profile=null;S.orders=[];S.coupons=[];S.ordersLoaded=false;
 if(unsubO){unsubO();unsubO=null}if(unsubC){unsubC();unsubC=null}
 if(u){
  S.profile=(await db.doc('users/'+u.uid).get()).data()||{};
  try{S.admin=(await db.doc('admins/'+u.uid).get()).exists}catch(e){}
  if((u.email||'').toLowerCase()=='byahandproductions@gmail.com')S.admin=true;
  /* admin is only "unlocked" if the database accepts the 3-code session */
  if(S.admin){try{await db.collection('coupons').limit(1).get();S.unlocked=true}catch(e){}}
  startData();
 }else if(['checkout','orders','admin','account'].includes(S.view))S.view='shop';
 render();
});

/* ===== views ===== */
function render(){
 $('hdr').innerHTML=`<div class="flex items-center gap-3"><button class="btn2 text-lg leading-none" onclick="side(1)" aria-label="Menu">☰</button><div class="flex items-center gap-3 cursor-pointer" onclick="go('shop')">
  <div class="w-12 h-12 rounded-full border border-pink-500 overflow-hidden">${im(S.site.logoUrl,'w-full h-full object-cover')}</div>
  <div><div class="cz text-xl font-bold tracking-widest g">BY A HAND</div><div class="text-[10px] tracking-[.2em] text-gray-400 uppercase">Powered by Zink Print</div></div></div></div>
  <div class="flex items-center gap-2 text-xs">
   ${S.user?`<button class="btn2 hidden sm:block" onclick="go('orders')">My Orders</button>`:''}
   ${S.admin?`<button class="btn2 text-pink-400 font-bold" onclick="go('admin')">Admin</button>`:''}
   <button class="btn2" onclick="cartOpen()">Bag (${S.cart.length})</button>
   ${S.user?`<button class="btn2" onclick="auth.signOut()">Sign out</button>`:`<button class="btn" onclick="authOpen('in')">Sign in</button>`}
  </div>`;
 $('app').innerHTML={shop,checkout,orders,admin,about,account}[S.view]();
 const gv=$('aGov').value;$('aGov').innerHTML='<option value="">Select governorate</option>'+govList().map(g=>`<option>${g}</option>`).join('');$('aGov').value=gv;
 $('fc').innerHTML=(S.site.tt?`<a title="TikTok" class="fcb" style="background:#000;border:1px solid #fff4" target="_blank" rel="noopener" href="${esc(safe(S.site.tt))}">♪</a>`:'')+(S.site.yt?`<a title="YouTube" class="fcb" style="background:#FF0000" target="_blank" rel="noopener" href="${esc(safe(S.site.yt))}">▶</a>`:'')+(S.site.insta?`<a title="Instagram" class="fcb" style="background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)" target="_blank" rel="noopener" href="${esc(safe(S.site.insta))}">📷</a>`:'')+(S.site.wa?`<a title="WhatsApp" class="fcb" style="background:#25D366" target="_blank" rel="noopener" href="https://wa.me/${esc(S.site.wa)}">💬</a>`:'');
 $('ft').innerHTML=`<div class="flex justify-center gap-5 text-sm">${S.site.insta?`<a class="text-pink-400" target="_blank" rel="noopener" href="${esc(safe(S.site.insta))}">Instagram</a>`:''}${S.site.tt?`<a class="text-pink-400" target="_blank" rel="noopener" href="${esc(safe(S.site.tt))}">TikTok</a>`:''}${S.site.yt?`<a class="text-pink-400" target="_blank" rel="noopener" href="${esc(safe(S.site.yt))}">YouTube</a>`:''}${S.site.wa?`<a class="text-pink-400" target="_blank" rel="noopener" href="https://wa.me/${esc(S.site.wa)}">WhatsApp</a>`:''}${S.site.legal?`<button class="underline" onclick="showTerms()">Terms &amp; policies</button>`:''}</div><div>&copy; 2026 By A Hand</div>`;
}

function vid(){const v=S.site.video;if(!v||!v.id)return '';return `<div class="rounded-2xl overflow-hidden mb-10 aspect-video w-full max-h-[70vh]"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${esc(v.id)}?autoplay=1&mute=1&controls=0&loop=1&playlist=${esc(v.id)}&start=${+v.start||0}${v.end?'&end='+(+v.end):''}&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`}
function cards(){const q=(S.q||'').trim().toLowerCase(),L=S.products.filter(p=>!q||[p.name,p.category,p.description].join(' ').toLowerCase().includes(q));return L.length?L.map(p=>`
 <div class="card overflow-hidden flex flex-col"><div class="cursor-pointer relative" onclick="openP('${p.id}')">${im(p.image,'aspect-square object-cover w-full')}${p.items&&p.items.length?'<span class="absolute top-2 left-2 btn !py-1">Bundle</span>':''}</div>
  <div class="p-4 flex-1"><div class="text-[10px] uppercase tracking-widest text-pink-400">${esc(p.category)}</div><h3 class="cz font-bold text-white">${esc(p.name)}</h3>${rt(p.id)}<p class="text-xs text-gray-400 mt-1">${esc(p.description)}</p></div>
  <div class="p-4 pt-0 flex flex-wrap items-center gap-2"><span class="cz text-pink-400 font-bold flex-1">EGP ${(+p.price).toLocaleString()}</span>
   ${pick(p,'s_'+p.id)}
   <button class="btn" onclick="addCart('${p.id}')">Add</button></div></div>`).join(''):'<p class="text-center text-gray-400 text-sm col-span-full">No products match your search.</p>'}
function shop(){
 const none=`<div class="card p-16 text-center max-w-xl mx-auto space-y-3"><div class="text-5xl">✨</div><h2 class="cz text-3xl text-white">No items yet</h2><p class="text-sm text-gray-400">Our first pieces are being made. Follow us to be the first to know.</p>${S.site.insta?`<a class="btn inline-block" target="_blank" rel="noopener" href="${esc(safe(S.site.insta))}">Follow on Instagram</a>`:''}${S.admin?'<p class="text-xs text-pink-400">Admin: add products from the Admin dashboard.</p>':''}</div>`;
 const list=`<h1 class="cz text-4xl g text-center mb-10">THE COLLECTION</h1><input id="q" type="search" class="in max-w-md mx-auto block mb-8" placeholder="Search products..." value="${esc(S.q)}" oninput="S.q=this.value;$('grid').innerHTML=cards()"><div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${cards()}</div>`;
 return vid()+(S.products.length?list:none)+(S.site.about?`<div class="card p-8 mt-16 text-center max-w-3xl mx-auto"><h2 class="cz text-2xl g mb-3">ABOUT US</h2><p class="text-sm text-gray-300 whitespace-pre-wrap">${esc(S.site.about)}</p></div>`:'')+nt();
}

function checkout(){
 const sub=sum(),t=sub-disc(sub),p=S.profile||{};
 if(!S.cart.length)return `<div class="card p-12 text-center">Your bag is empty.</div>`;
 return `<h1 class="cz text-3xl g mb-6">CHECKOUT</h1><div class="grid md:grid-cols-2 gap-6">
 <div class="card p-6 space-y-3"><h3 class="cz text-white">1. Delivery</h3>
  <div><label class="lb">Name</label><input id="cN" class="in" value="${esc(p.name)}"></div>
  <div><label class="lb">Phone</label><input id="cP" class="in" value="${esc(p.phone)}"></div>
  <div><label class="lb">Alternative phone (required)</label><input id="cP2" class="in" value="${esc(p.phone2)}"></div>
  <div><label class="lb">Governorate</label><select id="cG" class="in">${govList().map(g=>`<option ${g==p.governorate?'selected':''}>${g}</option>`).join('')}</select></div>
  <div><label class="lb">City / District</label><input id="cC" class="in" value="${esc(p.city)}"></div>
  <div><label class="lb">Address</label><textarea id="cA" rows="2" class="in">${esc(p.address)}</textarea></div></div>
 <div class="card p-6 space-y-3"><h3 class="cz text-white">2. Cash on delivery</h3>
  <p class="text-sm">You pay <b class="text-pink-400">EGP ${t.toLocaleString()}</b> in cash when your order arrives.</p>
  <div class="flex gap-2"><input id="cc" class="in" placeholder="Coupon code"><button class="btn2" onclick="applyCoupon()">Apply</button></div>${S.coupon?`<p class="text-xs text-pink-400">Coupon ${esc(S.coupon.code)}: -EGP ${disc(sub)}</p>`:''}${S.site.maxOrder&&t>S.site.maxOrder?`<p class="text-xs text-red-400">Maximum online order is EGP ${S.site.maxOrder}. Please reduce your bag.</p>`:''}
  <p class="text-[11px] text-gray-400">Every item is custom printed for you. We may call or message you to confirm your order before it is made, so please keep both phones on.</p>
  <button id="cB" class="btn w-full py-3" onclick="placeOrder()">Place order · EGP ${t.toLocaleString()}</button></div></div>`;
}

const when=o=>o.createdAt?o.createdAt.toDate().toLocaleString():'';
function orders(){
 if(!S.orders.length)return `<div class="card p-12 text-center">No orders yet.</div>`;
 return `<h1 class="cz text-3xl g mb-6">MY ORDERS</h1><div class="space-y-4">${S.orders.map(o=>`<div class="card p-5"><div class="flex justify-between flex-wrap gap-2"><span class="font-mono text-xs text-pink-400">${o.id}</span><span class="text-xs px-3 py-1 rounded-full border border-pink-500/40">${LBL[o.status]||o.status}</span></div>
 <p class="text-xs text-gray-400 mt-2">${when(o)} · EGP ${(+o.total).toLocaleString()}</p>${o.tracking?`<p class="text-xs text-pink-400">Tracking: ${esc(o.tracking)}</p>`:''}<div class="flex gap-1 mt-3">${['Placed','Approved','Production','Shipped','Delivered'].map((n,i)=>`<div class="flex-1 text-center"><div class="h-1.5 rounded ${i<=['pending','approved','sent_to_zink','shipped','delivered'].indexOf(o.status)?'bg-pink-500':'bg-[#3B185F]'}"></div><div class="text-[9px] text-gray-500 mt-1">${n}</div></div>`).join('')}</div>

/* ===== actions ===== */
function addCart(id,sz){const p=S.products.find(x=>x.id==id),v=noSize(p)?'':(sz||$('s_'+id).value);if(isCase(p)&&!MODELS.includes(v))return toast('Please choose your phone model from the list','e');S.cart.push({pid:id,name:p.name,price:+p.price,size:v,sku:skuOf(p),image:p.image,k:Math.random()});save();cartOpen()}
function cartOpen(){const t=S.cart.reduce((a,i)=>a+i.price,0);
 $('cartBox').innerHTML=`<div class="flex justify-between mb-4"><h3 class="cz g text-xl">YOUR BAG</h3><button onclick="$('cart').classList.add('hidden')">✕</button></div>
 ${S.cart.map(i=>`<div class="flex items-center gap-3 py-3 border-t border-[#3B185F]">${im(i.image,'w-14 h-14 rounded object-cover')}<div class="flex-1 text-sm"><b>${esc(i.name)}</b><div class="text-xs text-gray-400">${i.size?esc(i.size)+' · ':''}EGP ${esc(i.price)}</div></div><button onclick="S.cart=S.cart.filter(x=>x.k!=${+i.k});save();cartOpen();render()">🗑</button></div>`).join('')||'<p class="text-gray-500 text-sm">Your bag is empty.</p>'}
 <div class="flex justify-between font-bold my-4"><span>Total</span><span class="text-pink-400">EGP ${t.toLocaleString()}</span></div>
 <button class="btn w-full py-3" onclick="policyGate()">Checkout</button>`;
 $('cart').classList.remove('hidden');render()}

function authOpen(m){authMode(m);$('auth').classList.remove('hidden')}
function authMode(m){mode=m;const r=m=='reg';$('aReg').classList.toggle('hidden',!r);$('aT').textContent=r?'Create Account':'Sign In';$('aGo').textContent=r?'Register':'Sign In';$('aSw').textContent=r?'Have an account? Sign in':'New here? Register'}
async function authGo(){
 const e=$('aEmail').value.trim(),p=$('aPass').value;
 try{
  if(mode=='reg'){
   const d={name:$('aName').value.trim(),phone:$('aPhone').value.trim(),phone2:$('aPhone2').value.trim(),governorate:$('aGov').value,city:$('aCity').value.trim(),address:$('aAddr').value.trim(),email:e};
   if(!d.name||!d.phone||!d.phone2||!d.governorate||!d.city||!d.address)return toast('Please fill every field, including an alternative phone','e');
   if(!okPh(d.phone)||!okPh(d.phone2))return toast('Please enter valid phone numbers (digits only, 10-15)','e');
   if(ph(d.phone)==ph(d.phone2))return toast('The alternative phone must be a different number','e');
   const c=await auth.createUserWithEmailAndPassword(e,p);await db.doc('users/'+c.user.uid).set(d);S.profile=d;
  }else await auth.signInWithEmailAndPassword(e,p);
  $('auth').classList.add('hidden');toast('Welcome!')
 }catch(x){toast(x.message,'e')}
}

async function placeOrder(){
 const v=id=>$(id).value.trim();
 if(!v('cN')||!v('cP')||!v('cP2')||!v('cC')||!v('cA'))return toast('Please fill every field, including an alternative phone','e');
 if(!okPh(v('cP'))||!okPh(v('cP2')))return toast('Please enter valid phone numbers (digits only, 10-15)','e');
 if(ph(v('cP'))==ph(v('cP2')))return toast('The alternative phone must be a different number','e');
 if(S.site.maxOrder&&tot()>S.site.maxOrder)return toast('Orders above EGP '+S.site.maxOrder+' are not accepted online','e');
 if(!S.agreed)return policyGate();
 $('cB').disabled=true;
 try{
  const customer={name:v('cN'),phone:v('cP'),phone2:v('cP2'),governorate:$('cG').value,city:v('cC'),address:v('cA'),email:S.user.email};
  const ts=firebase.firestore.FieldValue.serverTimestamp(),ref=db.collection('orders').doc(),lim=db.doc('orderLimits/'+S.user.uid),code=S.coupon?S.coupon.code:null,total=tot(),discount=disc(sum());
  /* ONE atomic step: burn the coupon + start the cool-down + create the order. If any part is refused, nothing is saved. */
  await db.runTransaction(async t=>{
   let cref=null;
   if(code){cref=db.doc('coupons/'+code);const d=await t.get(cref);if(!d.exists||d.data().used||d.data().active===false)throw new Error('This coupon was already used')}
   if(cref)t.update(cref,{used:true,usedBy:S.user.uid});
   t.set(lim,{at:ts});
   t.set(ref,{uid:S.user.uid,customer,method:'cod',status:'pending',total,coupon:code,discount,items:S.cart.map(i=>({pid:i.pid,name:i.name,size:i.size,price:i.price,sku:i.sku||''})),createdAt:ts});
  });
  if(S.site.ejsKey)fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:S.site.ejsService,template_id:S.site.ejsTemplate,user_id:S.site.ejsKey,template_params:{title:'New order - EGP '+total,name:customer.name,email:S.user.email,time:new Date().toLocaleString(),message:'Phones: '+customer.phone+' / '+customer.phone2+' | Address: '+customer.governorate+', '+customer.city+', '+customer.address+' | Items: '+S.cart.map(i=>i.name+szt(i.size)).join(', ')+' | Cash on hand: EGP '+total}})}).catch(()=>{});
  S.cart=[];S.coupon=null;S.agreed=false;save();toast('Order placed - we will contact you to confirm');go('orders');
 }catch(x){toast(x.code=='permission-denied'?'We could not place this order. If you ordered in the last 10 minutes please wait a little, or contact us.':x.message,'e');$('cB').disabled=false}
}

async function setSite(e,k,doc){const f=e.target.files[0];if(!f)return;try{const u=await up(f,'s',k=='qrUrl'?600:300);await db.doc('settings/'+doc).set({[k]:u},{merge:true});toast('Saved')}catch(x){toast(x.message,'e')}}
async function saveProd(){
 const id=$('pId').value,old=S.products.find(p=>p.id==id),f=$('pI').files[0];
 try{
  const d={name:$('pN').value.trim(),price:+$('pP').value,category:$('pC').value.trim(),zinkSKU:$('pS').value.trim(),description:$('pD').value.trim(),image:old?.image||''};
  if(!d.name||!d.price||!d.zinkSKU)return toast('Name, price and SKU are required','e');
  if(f)d.image=await up(f,'p',700);
  id?await db.doc('products/'+id).set(d):await db.collection('products').add(d);toast('Product saved')
 }catch(x){toast(x.message,'e')}
}
function editProd(id){const p=S.products.find(x=>x.id==id);$('pId').value=id;$('pN').value=p.name;$('pP').value=p.price;$('pC').value=p.category;$('pS').value=p.zinkSKU;$('pD').value=p.description;$('pT').textContent='Edit product';scrollTo(0,300)}
async function delProd(id){if(confirm('Delete this product?'))await db.doc('products/'+id).delete()}
async function setStatus(id,v){try{await db.doc('orders/'+id).update({status:v});toast('Updated')}catch(x){toast(x.message,'e')}}

function side(o){const sd=$('sd');if(!o){sd.classList.add('hidden');return}const b=(l,v)=>`<button class="w-full text-left py-3 border-b border-[#3B185F] text-sm uppercase tracking-widest" onclick="side(0);go('${v}')">${l}</button>`;
 $('sdb').innerHTML=`<div class="flex justify-between mb-4"><span class="cz g text-lg">MENU</span><button onclick="side(0)">✕</button></div>${b('Products','shop')}${b('About us','about')}${b('Account','account')}${S.user?b('My orders','orders'):''}${S.admin?b('Admin dashboard','admin'):''}${S.user?`<button class="btn2 w-full mt-6" onclick="side(0);auth.signOut()">Log out</button>`:`<button class="btn w-full mt-6" onclick="side(0);authOpen('in')">Sign in / Register</button>`}`;sd.classList.remove('hidden')}
function about(){return `<h1 class="cz text-3xl g mb-6 text-center">ABOUT US</h1><div class="card p-8 max-w-3xl mx-auto text-sm text-gray-300 whitespace-pre-wrap">${S.site.about?esc(S.site.about):'Coming soon.'}</div>${nt()}`}
function account(){const p=S.profile||{};return `<h1 class="cz text-3xl g mb-6">MY ACCOUNT</h1><div class="card p-6 max-w-xl space-y-3"><div class="text-xs text-gray-400">${esc(S.user.email)} ${S.admin?'<b class="text-pink-400">· Administrator</b>':''}</div>
 <div><label class="lb">Name</label><input id="uN" class="in" value="${esc(p.name)}"></div><div><label class="lb">Phone</label><input id="uP" class="in" value="${esc(p.phone)}"></div><div><label class="lb">Alternative phone</label><input id="uP2" class="in" value="${esc(p.phone2)}"></div>
 <div><label class="lb">Governorate</label><select id="uG" class="in">${govList().map(g=>`<option ${g==p.governorate?'selected':''}>${g}</option>`).join('')}</select></div>
 <div><label class="lb">City / District</label><input id="uC" class="in" value="${esc(p.city)}"></div><div><label class="lb">Address</label><textarea id="uA" rows="2" class="in">${esc(p.address)}</textarea></div>
 <button class="btn w-full py-3" onclick="saveAcc()">Save changes</button>${S.admin?`<button class="btn2 w-full" onclick="go('admin')">Open admin dashboard</button>`:''}
 <button class="btn2 w-full" onclick="auth.signOut()">Log out</button><button class="btn2 w-full text-red-400" onclick="delAcc()">Delete my account</button></div>`}
async function saveAcc(){const d={name:$('uN').value.trim(),phone:$('uP').value.trim(),phone2:$('uP2').value.trim(),governorate:$('uG').value,city:$('uC').value.trim(),address:$('uA').value.trim()};if(!okPh(d.phone)||!okPh(d.phone2)||ph(d.phone)==ph(d.phone2))return toast('Enter two different valid phone numbers (main and alternative)','e');try{await db.doc('users/'+S.user.uid).set(d,{merge:true});S.profile={...S.profile,...d};toast('Saved')}catch(x){toast(x.message,'e')}}
async function delAcc(){if(!confirm('Delete your account permanently? This cannot be undone.'))return;try{await db.doc('users/'+S.user.uid).delete();await auth.currentUser.delete();toast('Account deleted')}catch(x){toast(x.code=='auth/requires-recent-login'?'For safety, sign out, sign in again, then delete':x.message,'e')}}
async function rate(id,n){try{await db.doc('ratings/'+id+'_'+S.user.uid).set({pid:id,stars:n,uid:S.user.uid});toast('Thanks for rating!');openP(id)}catch(x){toast(x.message,'e')}}
function showM(h){$('pmb').innerHTML='<button class="absolute top-3 right-4" onclick="$(\'pm\').classList.add(\'hidden\')">✕</button>'+h;$('pm').classList.remove('hidden')}
function tilt(e,el){const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(800px) rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`}
function openP(id){const p=S.products.find(x=>x.id==id);if(!p)return;showM(`<div class="grid md:grid-cols-2 gap-6 items-center"><div onmousemove="tilt(event,this)" onmouseleave="this.style.transform=''" style="transition:transform .1s">${im(p.image,'w-full rounded-xl')}</div><div class="space-y-3"><h2 class="cz text-2xl text-white">${esc(p.name)}</h2><p class="cz text-pink-400 text-xl">EGP ${(+p.price).toLocaleString()}</p><p class="text-sm text-gray-300">${esc(p.description)}</p>${rt(p.id)}${canRate(p.id)?`<div class="text-xs text-gray-400">Rate this product: ${[1,2,3,4,5].map(n=>`<button class="text-2xl text-pink-400" onclick="rate('${p.id}',${n})">${n<=myRate(p.id)?'★':'☆'}</button>`).join('')}</div>`:''}${p.items&&p.items.length?`<p class="text-xs text-gray-400">Includes: ${p.items.map(i=>esc((S.products.find(x=>x.id==i)||{}).name)).join(', ')}</p>`:''}${pick(p,'ps')}<button class="btn w-full py-3" onclick="addCart('${p.id}'${noSize(p)?'':`,$('ps').value`});$('pm').classList.add('hidden')">Add to bag</button></div></div>`)}
async function applyCoupon(){const c=$('cc').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!c)return;try{const d=await db.doc('coupons/'+c).get();if(!d.exists||!d.data().active||d.data().used)return toast('Invalid coupon','e');S.coupon={code:c,...d.data()};toast('Coupon applied');render()}catch(x){toast('Invalid coupon','e')}}
async function addCoupon(){
 const val=+$('kV').value,type=$('kT').value;
 if(!val||val<1)return toast('Enter the discount value','e');
 if(type=='pct'&&val>100)return toast('Percent must be between 1 and 100','e');
 const gen=()=>'BAH-'+[...crypto.getRandomValues(new Uint8Array(8))].map(n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');
 try{
  let c;
  await db.runTransaction(async t=>{c=gen();const r=db.doc('coupons/'+c);if((await t.get(r)).exists)throw new Error('Code clash, please press Generate again');t.set(r,{type,value:val,active:true,used:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})});
  toast('Coupon created: '+c);prompt('Copy this one-time code:',c)
 }catch(x){toast(x.message,'e')}
}
async function delCoupon(c){if(confirm('Delete coupon?'))await db.doc('coupons/'+c).delete()}
async function saveSite(){const u=$('sVid').value.trim(),m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);try{await db.doc('settings/site').set({about:$('sAbout').value,insta:$('sInsta').value.trim(),yt:$('sYt').value.trim(),tt:$('sTt').value.trim(),notes:$('sNotes').value,wa:$('sWa').value.replace(/\D/g,''),legal:$('sLegal').value,maxOrder:+$('sMax').value||0,ejsService:$('sE1').value.trim(),ejsTemplate:$('sE2').value.trim(),ejsKey:$('sE3').value.trim(),video:{id:m?m[1]:'',url:u,start:+$('sVs').value||0,end:+$('sVe').value||0}},{merge:true});toast('Saved')}catch(x){toast(x.message,'e')}}
async function saveBundle(){const f=$('bI').files[0],items=[...document.querySelectorAll('.bc:checked')].map(c=>c.value);if(!$('bN').value.trim()||!+$('bP').value||items.length<2)return toast('Name, price and at least 2 products needed','e');try{await db.collection('products').add({name:$('bN').value.trim(),price:+$('bP').value,category:'Bundle',description:$('bD').value.trim(),zinkSKU:'',items,image:f?await up(f,'p',700):''});toast('Bundle saved')}catch(x){toast(x.message,'e')}}
async function saveGovs(){const g=[...document.querySelectorAll('.gv:checked')].map(c=>c.value);try{await db.doc('settings/site').set({govs:g},{merge:true});toast('Saved')}catch(x){toast(x.message,'e')}}
function copyAddr(id){const o=S.orders.find(x=>x.id==id),c=o.customer;navigator.clipboard.writeText(c.name+'\n'+c.phone+'\n'+c.governorate+', '+c.city+', '+c.address).then(()=>toast('Copied'))}
async function secDone(){try{await db.doc('settings/site').set({secDone:Date.now()},{merge:true});toast('Saved')}catch(x){toast(x.message,'e')}}
async function blockUser(u){if(!confirm('Block this customer from placing orders?'))return;try{await db.doc('blocked/'+u).set({at:Date.now()});toast('Blocked')}catch(x){toast(x.message,'e')}}
async function setShip(id){const t=prompt('Tracking number or courier note (optional)');if(t===null)return;try{await db.doc('orders/'+id).update({status:'shipped',tracking:t.trim()});toast('Updated')}catch(x){toast(x.message,'e')}}

function adminLock(){return `<div class="card p-6 max-w-md mx-auto space-y-3"><h1 class="cz text-2xl g">ADMIN LOCK</h1><p class="text-xs text-gray-400">Enter your 3 admin codes. The database checks them itself, so hiding this screen is not enough to get in. A session lasts 6 hours. The codes stop working 90 days after you last changed them.</p><input id="ac1" type="password" autocomplete="off" class="in" placeholder="Code 1"><input id="ac2" type="password" autocomplete="off" class="in" placeholder="Code 2"><input id="ac3" type="password" autocomplete="off" class="in" placeholder="Code 3"><button class="btn w-full py-3" onclick="unlockAdmin()">Unlock</button></div>`}
async function unlockAdmin(){
 const c=[1,2,3].map(n=>$('ac'+n).value.trim());
 if(c.some(x=>!x))return toast('Enter all 3 codes','e');
 try{
  await db.doc('adminSessions/'+S.user.uid).set({c1:c[0],c2:c[1],c3:c[2],until:firebase.firestore.Timestamp.fromMillis(Date.now()+6*36e5)});
  await db.collection('coupons').limit(1).get();
  S.unlocked=true;startData();toast('Admin unlocked');render();
 }catch(x){toast('Wrong codes, or the codes are older than 90 days. Update them in Firebase console > adminSecrets > codes.','e')}
}
async function lockAdmin(){try{await db.doc('adminSessions/'+S.user.uid).delete()}catch(e){}S.unlocked=false;startData();go('shop')}
async function cancelOrder(id){if(!confirm('Cancel this order?'))return;try{await db.doc('orders/'+id).update({status:'cancelled'});toast('Order cancelled')}catch(x){toast(x.code=='permission-denied'?'This order can no longer be cancelled. Please contact us.':x.message,'e')}}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Copied'))}
function showTerms(){showM('<h3 class="cz g text-xl mb-3">Terms &amp; policies</h3><p class="text-sm whitespace-pre-wrap">'+esc(S.site.legal)+'</p>')}

function copyOrder(id){const o=S.orders.find(x=>x.id==id),c=o.customer;
 const L=['Order '+o.id,'Name: '+c.name,'Phone: '+c.phone,'Alt phone: '+c.phone2,'Address: '+c.governorate+', '+c.city+', '+c.address,'','Items:',...o.items.map(i=>'- '+i.name+(i.size?' ('+i.size+')':'')+(i.sku?' | SKU '+i.sku:'')+' | EGP '+i.price)];
 if(o.coupon)L.push('Coupon '+o.coupon+': -EGP '+(o.discount||0));
 L.push('','Cash to collect: EGP '+o.total);
 navigator.clipboard.writeText(L.join('\n')).then(()=>toast('Order copied'))}
